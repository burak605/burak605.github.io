<!doctype html>
<html>
<body>
<script>
function tryStart(process, args, label) {
    const url = 'http://127.0.0.1:8082/api/Client/StartProcessWithArguments/' +
        process + '/' + encodeURIComponent(args);
    console.log('DENIYOR:', label, '->', url);
    fetch(url, { method: 'POST' })
        .then(r => { console.log(label, 'HTTP:', r.status); return r.text(); })
        .then(t => console.log(label, 'BODY:', t))
        .catch(e => console.error(label, 'FETCH ERROR:', e));
}

// T1: argumansiz basit process (notepad acilirsa API calisiyor demektir)
tryStart('notepad.exe', '', 'T1-notepad');

// T2: cmd ile dosya yazma (bosluk yok)
tryStart('cmd.exe', '/c whoami > C:\\ClientWorker\\t2.txt', 'T2-cmd');

// T3: powershell, bosluksuz komut
tryStart('powershell.exe', 'whoami', 'T3-ps');
</script>
<h2>ClientWorker Debug 2</h2>
</body>
</html>
